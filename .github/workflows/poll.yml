name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two polls at once: one Telegram session must not be used from two connections in parallel.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Poll Telegram presence
        run: npm run poll
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_TARGETS: ${{ secrets.TG_TARGETS }}
          TG_DATA_KEY: ${{ secrets.TG_DATA_KEY }}

      - name: Commit samples
        # Runs even if the poll step failed so a freshly resolved (encrypted) cache is kept.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "telegram-tracker[bot]"
          git config user.email "telegram-tracker[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
